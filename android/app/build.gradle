plugins {
    id "com.android.application"
}

import java.util.Properties
import java.io.FileInputStream

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// Default demo/sideload keystore (committed) — required so release APKs are never unsigned.
// Override via android/keystore.properties if you have your own store.
def demoStoreFile = rootProject.file("keystore/apex-release.jks")
def storeFilePath = keystoreProps.getProperty("storeFile", "keystore/apex-release.jks")
def resolvedStore = rootProject.file(storeFilePath)
if (!resolvedStore.exists()) {
    resolvedStore = demoStoreFile
}
def storePass = keystoreProps.getProperty("storePassword", "ApexCare26Sideload")
def keyAliasName = keystoreProps.getProperty("keyAlias", "apexcare")
def keyPass = keystoreProps.getProperty("keyPassword", "ApexCare26Sideload")

android {
    namespace "com.apexcare.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.apexcare.app"
        // Galaxy S6 / S7 flagships (Lollipop 5.0) through current One UI
        minSdk 21
        targetSdk 34
        versionCode 26
        versionName "1.0.4"

        // Samsung flagships are ARM. x86 in a phone APK is a Play Protect PUP heuristic.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

        vectorDrawables.useSupportLibrary = true

        resConfigs "en"
    }

    // Single universal APK — no density/ABI/language splits
    splits {
        abi {
            enable false
        }
        density {
            enable false
        }
    }

    signingConfigs {
        release {
            storeFile resolvedStore
            storePassword storePass
            keyAlias keyAliasName
            keyPassword keyPass
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        debug {
            // Same cert as release so debug/release can overwrite each other when sideloading
            storeFile resolvedStore
            storePassword storePass
            keyAlias keyAliasName
            keyPassword keyPass
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/*.kotlin_module"
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.webkit:webkit:1.8.0"
}
