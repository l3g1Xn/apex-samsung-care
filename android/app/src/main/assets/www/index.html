<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>Apex Care v0.1.5 beta</title>
  <style>
    :root {
      --bg: #07080a; --surface: #101214; --elevated: #161a1e; --subtle: #1c2228;
      --fg: #eef1f4; --muted: #8b959e; --faint: #5c6670;
      --border: #252b32; --primary: #3ecfbf; --primary-fg: #041312;
      --warn: #e8b86d; --danger: #e07a7a; --ok: #5ecf8a; --info: #6eb0e0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .app { max-width: 28rem; margin: 0 auto; min-height: 100dvh; padding-bottom: 5.25rem; }
    header { position: sticky; top: 0; z-index: 20; background: rgba(7,8,10,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: .75rem 1rem; }
    header .row { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
    .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 0; }
    h1 { font-size: 1.125rem; margin: 0; font-weight: 600; letter-spacing: -0.02em; }
    .badge { flex-shrink: 0; border-radius: 999px; border: 1px solid #3ecfbf55; background: #3ecfbf18; color: var(--primary); font-size: 11px; font-weight: 500; padding: .25rem .65rem; }
    main { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 1rem; }
    .center { text-align: center; }
    .ring-wrap { display: flex; justify-content: center; margin: .25rem 0 .25rem; }
    .ring { position: relative; width: 160px; height: 160px; }
    .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring .score { font-size: 2.25rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
    .ring .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
    .ring .sub { font-size: 11px; color: var(--faint); margin-top: 2px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 2.75rem; padding: 0 1rem; border-radius: .5rem; font-size: .875rem; font-weight: 500; width: 100%; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); }
    .btn-secondary { background: var(--elevated); color: var(--fg); border: 1px solid var(--border); }
    .btn-sm { height: 2.25rem; font-size: 12px; padding: 0 .75rem; width: auto; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .stat { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: .875rem; }
    .stat .t { font-size: 11px; color: var(--faint); font-weight: 500; }
    .stat .v { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .stat .s { font-size: 11px; color: var(--muted); }
    .bar { height: 6px; background: var(--subtle); border-radius: 999px; overflow: hidden; margin-top: .55rem; }
    .bar > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
    .muted { color: var(--muted); font-size: .75rem; line-height: 1.5; }
    .faint { color: var(--faint); font-size: 11px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .list { display: flex; flex-direction: column; gap: .5rem; }
    .item { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: .875rem; }
    .avatar { width: 2.4rem; height: 2.4rem; border-radius: .7rem; background: var(--elevated); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--primary); flex-shrink: 0; }
    .chip { display: inline-flex; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 500; }
    .chip-sys { background: var(--elevated); color: var(--faint); }
    .chip-user { background: #3ecfbf22; color: var(--primary); }
    .chip-off { background: #e07a7a22; color: var(--danger); }
    .chip-high { background: #e07a7a22; color: var(--danger); }
    .chip-med { background: #e8b86d22; color: var(--warn); }
    .chip-low { background: #3ecfbf22; color: var(--primary); }
    .chip-info { background: #6eb0e022; color: var(--info); }
    .chip-warn { background: #e8b86d22; color: var(--warn); }
    .chips { display: flex; gap: .375rem; overflow-x: auto; padding-bottom: 2px; }
    .chips button { flex-shrink: 0; border-radius: 999px; border: 1px solid var(--border); background: var(--elevated); color: var(--muted); padding: .375rem .75rem; font-size: 12px; font-weight: 500; }
    .chips button.on { border-color: #3ecfbf66; background: #3ecfbf22; color: var(--primary); }
    nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: rgba(16,18,20,0.96); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: .35rem .25rem max(.5rem, env(safe-area-inset-bottom)); }
    nav .inner { max-width: 28rem; margin: 0 auto; display: flex; }
    nav button { flex: 1; min-width: 0; min-height: 3rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: transparent; color: var(--faint); font-size: 10px; font-weight: 500; }
    nav button.on { color: var(--primary); }
    .search { position: relative; }
    .search input { width: 100%; height: 2.75rem; border-radius: .75rem; border: 1px solid var(--border); background: var(--elevated); color: var(--fg); padding: 0 .75rem 0 2.4rem; font-size: .875rem; outline: none; }
    .search span { position: absolute; left: .75rem; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; color: var(--faint); word-break: break-all; }
    h2 { font-size: .875rem; font-weight: 600; margin: 0 0 .5rem; }
    .mt { margin-top: .75rem; }
    .progress { height: 8px; background: var(--subtle); border-radius: 999px; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--primary); width: 0; transition: width .25s; }
    /* Widget-aligned RAM cleaner */
    .widget-shell { border-radius: 1rem; border: 1px solid #3ecfbf33; background: rgba(7,8,10,0.9); padding: .75rem; }
    .widget-inner { display: flex; align-items: center; justify-content: space-between; gap: .75rem; border-radius: .75rem; border: 1px solid var(--border); background: rgba(16,18,20,0.85); padding: .75rem .9rem; }
    .widget-title { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
    .widget-ram { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .widget-storage { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .widget-clean { flex-shrink: 0; min-width: 4rem; height: 2.25rem; border-radius: 999px; background: var(--primary); color: var(--primary-fg); font-size: 13px; font-weight: 600; padding: 0 .9rem; }
    .sched { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
    .sched button { border-radius: .75rem; border: 1px solid var(--border); background: var(--elevated); color: var(--muted); padding: .65rem .4rem; text-align: center; }
    .sched button.on { border-color: #3ecfbf66; background: #3ecfbf22; color: var(--primary); }
    .sched .l { font-size: 12px; font-weight: 600; }
    .sched .d { font-size: 10px; opacity: .8; margin-top: 2px; }
    a.link { color: var(--primary); text-decoration: none; font-size: 12px; }
    a.link:hover { text-decoration: underline; }
    .history-item { border-radius: .75rem; border: 1px solid var(--border); background: var(--elevated); padding: .5rem .75rem; }
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const VERSION = "v0.1.5 beta";
const VERSION_CODE = 15;
const PACKAGE_ID = "com.apexcare.app";
const GITHUB = "https://github.com/l3g1Xn/apex-samsung-care";
const hasNative = typeof ApexNative !== "undefined";

const CORE_PROTECT = new Set([
  "android","com.android.systemui","com.android.settings","com.android.phone",
  "com.android.server.telecom","com.google.android.gms","com.google.android.gsf",
  "com.android.inputmethod.latin","com.google.android.inputmethod.latin",
  "com.android.permissioncontroller","com.google.android.permissioncontroller",
  "com.android.providers.settings","com.android.providers.media","com.android.providers.telephony",
  "com.android.bluetooth","com.android.nfc","com.android.keychain","com.android.shell",
  PACKAGE_ID
]);

const state = {
  tab: "home",
  apps: [],
  scanOk: false,
  scanError: null,
  scanning: false,
  scannedAt: null,
  filter: "all",
  q: "",
  mem: null,
  score: 72,
  history: [],
  closing: false,
  autoSchedule: (function(){ try { return localStorage.getItem("apex.autoSchedule") || "off"; } catch (e) { return "off"; } })(),
  safe: {
    scanning: false, ok: false, error: null, score: null, scannedAt: null,
    findings: [], stats: null, progress: 0, phase: "",
  },
  findingFilter: "all",
};

function tone(score) {
  if (score >= 80) return "var(--ok)";
  if (score >= 55) return "var(--primary)";
  if (score >= 35) return "var(--warn)";
  return "var(--danger)";
}
function sevChip(sev) {
  if (sev === "high") return "chip-high";
  if (sev === "medium") return "chip-med";
  if (sev === "low") return "chip-low";
  return "chip-info";
}
function fmtGb(n) {
  if (n == null || isNaN(n)) return "—";
  return n.toFixed(1) + " GB";
}
function escapeHtml(s) {
  return String(s == null ? "" : s)
    .split("&").join("&" + "amp;")
    .split("<").join("&" + "lt;")
    .split('"').join("&" + "quot;");
}
function isProtected(pkg) {
  if (!pkg) return true;
  if (CORE_PROTECT.has(pkg)) return true;
  if (pkg.startsWith("com.android.providers.")) return true;
  const lower = pkg.toLowerCase();
  if (lower.includes("telecom") || lower.includes("telephony")) return true;
  return false;
}
function computeHealthScore() {
  const m = state.mem;
  if (!m) return 72;
  let s = 100;
  if (m.totalRamGb > 0) {
    const usedPct = ((m.totalRamGb - m.freeRamGb) / m.totalRamGb) * 100;
    s -= Math.min(35, usedPct * 0.35);
  }
  if (m.lowMemory) s -= 12;
  if (state.safe.score != null) s = s * 0.75 + state.safe.score * 0.25;
  return Math.round(Math.min(99, Math.max(18, s)));
}
function pushHistory(label, detail) {
  state.history.unshift({ id: Date.now() + Math.random(), at: Date.now(), label, detail });
  state.history = state.history.slice(0, 12);
}
function loadMemory() {
  if (!hasNative) return;
  try {
    state.mem = JSON.parse(ApexNative.getMemoryStats());
    state.score = computeHealthScore();
  } catch (e) {}
}
function storageLine() {
  const m = state.mem;
  if (!m) return "Storage —";
  const pct = m.storageUsedPct != null ? Math.round(m.storageUsedPct) : null;
  const used = m.storageUsedGb != null ? m.storageUsedGb.toFixed(1) + " GB used" : null;
  if (pct != null && used) return "Storage " + pct + "% · " + used;
  if (pct != null) return "Storage " + pct + "%";
  return "Storage —";
}
function ramCleanerHtml() {
  const free = state.mem ? state.mem.freeRamGb.toFixed(1) + " GB free" : "— GB free";
  return `<div class="widget-shell">
    <div class="widget-inner">
      <div style="min-width:0;flex:1">
        <div class="widget-title">Apex Care</div>
        <div class="widget-ram">${free}</div>
        <div class="widget-storage">${storageLine()}</div>
      </div>
      <button class="widget-clean" ${state.closing ? "disabled" : ""} onclick="window.AC.clean()">${state.closing ? "…" : "Clean"}</button>
    </div>
  </div>`;
}

function scanApps() {
  if (!hasNative) {
    state.scanOk = false;
    state.scanError = "Open Apex Care from the installed APK to scan real packages.";
    state.apps = [];
    render();
    return;
  }
  state.scanning = true;
  state.scanError = null;
  render();
  setTimeout(() => {
    try {
      const data = JSON.parse(ApexNative.scanInstalledApps());
      if (data.ok) {
        state.apps = (data.apps || []).map(a => ({
          ...a,
          closeable: a.closeable !== false && !isProtected(a.packageName),
          protectReason: isProtected(a.packageName) ? "core_os" : (a.protectReason || "none"),
        }));
        state.scanOk = true;
        state.scannedAt = data.scannedAt || Date.now();
        state.scanError = null;
      } else {
        state.apps = [];
        state.scanOk = false;
        state.scanError = data.error || "Scan failed";
      }
    } catch (e) {
      state.scanOk = false;
      state.scanError = String(e.message || e);
      state.apps = [];
    }
    state.scanning = false;
    state.score = computeHealthScore();
    render();
  }, 40);
}

function runSafeScan() {
  if (!hasNative) {
    state.safe.ok = false;
    state.safe.error = "Heuristic scanner requires the installed APK (native bridge).";
    state.safe.findings = [];
    render();
    return;
  }
  state.safe.scanning = true;
  state.safe.error = null;
  state.safe.progress = 12;
  state.safe.phase = "Enumerating packages…";
  render();
  const steps = [
    [28, "Checking install sources…"],
    [48, "Scoring PUA / malware patterns…"],
    [68, "Reviewing weaponized permissions…"],
    [88, "Ranking findings…"],
  ];
  let i = 0;
  const tick = () => {
    if (i < steps.length) {
      state.safe.progress = steps[i][0];
      state.safe.phase = steps[i][1];
      i++;
      render();
      setTimeout(tick, 200);
      return;
    }
    try {
      const data = JSON.parse(ApexNative.runHeuristicScan());
      if (data.ok) {
        state.safe.ok = true;
        state.safe.score = data.score;
        state.safe.scannedAt = data.scannedAt || Date.now();
        state.safe.findings = data.findings || [];
        state.safe.stats = {
          packages: data.packages,
          userApps: data.userApps,
          systemApps: data.systemApps,
          disabled: data.disabled,
          sideloaded: data.sideloaded,
          debuggable: data.debuggable,
          highRiskPermHits: data.highRiskPermHits,
          outdatedTarget: data.outdatedTarget,
          findingCount: data.findingCount,
          malwareSignals: data.malwareSignals || 0,
          puaSignals: data.puaSignals || 0,
        };
        state.safe.error = null;
      } else {
        state.safe.ok = false;
        state.safe.error = data.error || "Heuristic scan failed";
        state.safe.findings = [];
      }
    } catch (e) {
      state.safe.ok = false;
      state.safe.error = String(e.message || e);
      state.safe.findings = [];
    }
    state.safe.scanning = false;
    state.safe.progress = 100;
    state.safe.phase = "Done";
    state.score = computeHealthScore();
    render();
  };
  setTimeout(tick, 180);
}

function cleanRam() {
  if (state.closing) return;
  state.closing = true;
  render();
  setTimeout(() => {
    let closed = 0;
    // Prefer native close for non-protected packages when available
    if (hasNative && typeof ApexNative.closeBackgroundApp === "function") {
      const targets = state.apps.filter(a => a.enabled && !a.system && !isProtected(a.packageName)).slice(0, 40);
      targets.forEach(a => {
        try {
          const r = JSON.parse(ApexNative.closeBackgroundApp(a.packageName));
          if (r && r.ok) closed++;
        } catch (e) {}
      });
    }
    loadMemory();
    state.closing = false;
    pushHistory("RAM cleaned", closed > 0
      ? "Closed " + closed + " background apps · " + (state.mem ? state.mem.freeRamGb.toFixed(1) + " GB free" : "refreshed")
      : (state.mem ? state.mem.freeRamGb.toFixed(1) + " GB free · widget action" : "Stats refreshed"));
    render();
  }, 420);
}

function ring(score, label, sub) {
  const r = 74, c = 2 * Math.PI * r, off = c - (score / 100) * c;
  return `<div class="ring-wrap"><div class="ring">
    <svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--subtle)" stroke-width="10"/>
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="${tone(score)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <div class="mid"><div class="score">${score}</div><div class="lbl">${label}</div><div class="sub">${sub}</div></div>
  </div></div>`;
}

function home() {
  const m = state.mem;
  const userCount = state.apps.filter(a => !a.system).length;
  const totalCount = state.apps.length;
  const safeScore = state.safe.score;
  const healthSub = state.score >= 80 ? "Running smoothly" : state.score >= 55 ? "Needs attention" : "Heavy load";
  const malware = state.safe.stats ? (state.safe.stats.malwareSignals || 0) : 0;
  const pua = state.safe.stats ? (state.safe.stats.puaSignals || 0) : 0;

  return `
    <div class="card center">
      ${ring(state.score, "Health", healthSub)}
      <div class="grid2 mt" style="gap:.5rem">
        <button class="btn btn-primary" onclick="window.AC.clean()" ${state.closing?"disabled":""}>${state.closing?"Cleaning…":"Optimize now"}</button>
        <button class="btn btn-secondary" onclick="window.AC.refreshAll()">Refresh</button>
      </div>
    </div>
    <div class="card" style="padding:.875rem">
      <div class="row" style="margin-bottom:.55rem">
        <h2 style="margin:0">RAM cleaner</h2>
        <span class="faint" style="text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:600">Same as widget</span>
      </div>
      ${ramCleanerHtml()}
      <p class="faint mt" style="margin-bottom:0">Clean matches the home-screen widget — free RAM, storage, protect-aware close.</p>
    </div>
    <button class="stat" onclick="window.AC.tab('safe')" style="text-align:left;width:100%">
      <div class="t">Safe score</div>
      <div class="v">${safeScore != null ? safeScore : "—"}</div>
      <div class="s">${state.safe.ok ? (malware + " malware · " + pua + " PUA") : "Tap to scan"}</div>
      <div class="bar"><i style="width:${safeScore != null ? safeScore : 0}%"></i></div>
    </button>
    <div class="card">
      <div class="row"><h2 style="margin:0">Installed apps</h2>
        <button class="btn btn-sm btn-secondary" ${state.scanning ? "disabled" : ""} onclick="window.AC.scan()">${state.scanning ? "Scanning…" : "Scan device"}</button>
      </div>
      <p class="muted mt" style="margin-bottom:0">
        ${state.scanOk
          ? `Found <strong style="color:var(--fg)">${totalCount}</strong> packages · <strong style="color:var(--primary)">${userCount}</strong> user apps.`
          : (state.scanError || "Tap Scan device to list packages on this phone.")}
      </p>
    </div>
    ${state.history.length ? `
    <div class="card">
      <h2>Recent activity</h2>
      <div class="list">
        ${state.history.slice(0,5).map(h => `
          <div class="history-item">
            <div style="font-size:.875rem;font-weight:500">${escapeHtml(h.label)}</div>
            <div class="faint">${new Date(h.at).toLocaleTimeString()} · ${escapeHtml(h.detail)}</div>
          </div>`).join("")}
      </div>
    </div>` : ""}
  `;
}

function safePanel() {
  const s = state.safe;
  const ff = state.findingFilter;
  let findings = s.findings.slice();
  if (ff !== "all") findings = findings.filter(f => f.severity === ff);
  const sub = s.score == null ? "Not scanned yet"
    : s.score >= 80 ? "Looking solid" : s.score >= 55 ? "Review findings" : "Elevated risk signals";

  return `
    <div class="card center">
      ${s.score != null
        ? ring(s.score, "Safe", sub)
        : `<div class="ring-wrap"><div class="ring" style="display:flex;align-items:center;justify-content:center"><div class="mid"><div class="lbl">Safe</div><div class="sub">Local heuristics</div></div></div></div>`}
      <p class="muted" style="margin:.5rem 0 0">On-device malware / PUA heuristics — install sources, weaponized permissions, debuggable flags, fake-cleaner patterns. No cloud DB.</p>
      <button class="btn btn-primary mt" ${s.scanning ? "disabled" : ""} onclick="window.AC.safeScan()">
        ${s.scanning ? s.phase : (s.ok ? "Scan again" : "Run heuristic scan")}
      </button>
      ${s.scanning ? `<div class="progress mt"><i style="width:${s.progress}%"></i></div><p class="faint" style="margin:.4rem 0 0">${s.progress}%</p>` : ""}
      ${s.error ? `<p class="muted mt" style="color:var(--danger)">${escapeHtml(s.error)}</p>` : ""}
      ${s.scannedAt && !s.scanning ? `<p class="faint mt">Last scan ${new Date(s.scannedAt).toLocaleString()}</p>` : ""}
    </div>
    ${s.stats ? `
    <div class="grid2">
      <div class="stat"><div class="t">Packages</div><div class="v">${s.stats.packages}</div><div class="s">${s.stats.userApps} user · ${s.stats.systemApps} system</div></div>
      <div class="stat"><div class="t">Signals</div><div class="v">${s.stats.findingCount}</div><div class="s">${s.stats.sideloaded} sideload · ${s.stats.debuggable} debug</div></div>
      <div class="stat"><div class="t">Malware signals</div><div class="v" style="color:var(--danger)">${s.stats.malwareSignals||0}</div><div class="s">Debuggable · weaponized perms</div></div>
      <div class="stat"><div class="t">PUA signals</div><div class="v" style="color:var(--warn)">${s.stats.puaSignals||0}</div><div class="s">Fake cleaners · sideloads</div></div>
    </div>` : ""}
    ${s.ok ? `
    <div class="chips">
      ${[["all","All"],["high","High"],["medium","Medium"],["low","Low"],["info","Info"]].map(([id,l]) =>
        `<button class="${ff===id?"on":""}" onclick="window.AC.setFindingFilter('${id}')">${l}</button>`).join("")}
    </div>
    <div class="list">
      ${findings.length === 0 ? `<div class="card center muted">No findings in this filter.</div>` : findings.map(f => `
        <div class="item">
          <div style="display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-bottom:.25rem">
            <strong style="font-size:.875rem">${escapeHtml(f.title)}</strong>
            <span class="chip ${sevChip(f.severity)}">${escapeHtml(f.severity)}</span>
            ${f.kind ? `<span class="chip chip-info">${escapeHtml(f.kind)}</span>` : ""}
          </div>
          <p class="muted" style="margin:0">${escapeHtml(f.detail)}</p>
          ${f.packageName ? `<div class="mono mt">${escapeHtml(f.packageName)}</div>` : ""}
        </div>`).join("")}
    </div>` : (s.scanning ? "" : `<div class="card muted">Run a scan to populate findings. Heuristics flag malware-capable permission combos, PUA patterns, unknown installers, debuggable builds, and outdated targets.</div>`)}
  `;
}

function appsPanel() {
  let list = state.apps.slice();
  const f = state.filter;
  const q = state.q.trim().toLowerCase();
  if (f === "user") list = list.filter(a => !a.system);
  if (f === "system") list = list.filter(a => a.system);
  if (f === "disabled") list = list.filter(a => !a.enabled);
  if (f === "background") list = list.filter(a => a.enabled && !a.system && !isProtected(a.packageName));
  if (q) list = list.filter(a => (a.name || "").toLowerCase().includes(q) || (a.packageName || "").toLowerCase().includes(q));

  return `
    <div class="card">
      <h2>App inventory</h2>
      <p class="muted">Live list from this device’s package manager. Background filter surfaces apps you can safely close.</p>
      <div class="search mt"><span>⌕</span>
        <input type="search" placeholder="Search name or package" value="${escapeHtml(state.q || "")}" oninput="window.AC.setQ(this.value)" />
      </div>
      <div class="chips mt">
        ${[["all","All"],["user","User"],["system","System"],["background","Background"],["disabled","Disabled"]].map(([id,l]) =>
          `<button class="${f===id?"on":""}" onclick="window.AC.setFilter('${id}')">${l}</button>`).join("")}
      </div>
      <div class="row mt"><span class="faint">${list.length} shown · ${state.apps.length} scanned</span>
        <button class="btn btn-sm btn-secondary" ${state.scanning?"disabled":""} onclick="window.AC.scan()">${state.scanning?"Scanning…":"Rescan"}</button>
      </div>
    </div>
    <div class="list">
      ${!state.scanOk && !state.scanning ? `<div class="card center muted">${state.scanError || "Scan the device to load apps."}</div>` : ""}
      ${state.scanning ? `<div class="card center muted">Scanning installed packages…</div>` : ""}
      ${list.map(a => {
        const prot = isProtected(a.packageName);
        return `
        <div class="item">
          <div style="display:flex;gap:.75rem">
            <div class="avatar">${(a.name||"?").slice(0,2).toUpperCase()}</div>
            <div style="min-width:0;flex:1">
              <div style="display:flex;flex-wrap:wrap;gap:.35rem;align-items:center">
                <strong style="font-size:.875rem">${escapeHtml(a.name || a.packageName)}</strong>
                ${a.system ? '<span class="chip chip-sys">System</span>' : '<span class="chip chip-user">User</span>'}
                ${!a.enabled ? '<span class="chip chip-off">Disabled</span>' : ''}
                ${prot ? '<span class="chip chip-info">Protected</span>' : ''}
              </div>
              <div class="mono">${escapeHtml(a.packageName || "")}</div>
              <div class="faint" style="margin-top:.25rem">${a.versionName ? "v" + escapeHtml(a.versionName) : ""} ${a.lastUpdateTime ? "· updated " + new Date(a.lastUpdateTime).toLocaleDateString() : ""}</div>
              ${!prot && a.enabled && !a.system ? `<button class="btn btn-sm btn-secondary mt" style="margin-top:.5rem" onclick="window.AC.closeOne('${escapeHtml(a.packageName)}')">Close</button>` : ""}
            </div>
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function morePanel() {
  const sched = state.autoSchedule;
  return `
    <div class="card">
      <h2>Auto-optimize</h2>
      <p class="muted">Schedule hang-RAM cleanup preference on this device.</p>
      <div class="sched mt">
        ${[["off","Off","Manual only"],["nightly","Nightly","2:00 AM local"],["twice","Twice daily","9 AM + 9 PM"]].map(([id,l,d]) =>
          `<button class="${sched===id?"on":""}" onclick="window.AC.setSchedule('${id}')"><div class="l">${l}</div><div class="d">${d}</div></button>`).join("")}
      </div>
    </div>
    <div class="card">
      <h2>RAM widget</h2>
      <p class="muted">Long-press home → Widgets → <strong style="color:var(--fg)">Apex Care · RAM</strong>. Same free RAM · storage · Clean as Care.</p>
      <div class="mt">${ramCleanerHtml()}</div>
    </div>
    <div class="card">
      <h2>Source & releases</h2>
      <p class="muted">Package <span class="mono">${PACKAGE_ID}</span> · ${VERSION} · versionCode ${VERSION_CODE}</p>
      <a class="btn btn-secondary mt" href="${GITHUB}" target="_blank" rel="noreferrer" style="text-decoration:none">GitHub repository</a>
      <p class="center mt"><a class="link" href="${GITHUB}/releases" target="_blank" rel="noreferrer">Releases on GitHub</a></p>
    </div>
    <div class="card">
      <h2>About</h2>
      <p class="muted">${VERSION}. Safe close respects core OS / telephony / keyboard. Malware & PUA heuristics run on-device. Health has no fixed phone model label.</p>
      <p class="faint mt">Native bridge: ${hasNative ? "connected" : "unavailable"}</p>
    </div>
  `;
}

function render() {
  const tabs = [
    ["home", "Care"],
    ["apps", "Apps"],
    ["safe", "Safe"],
    ["more", "More"],
  ];
  const body = state.tab === "home" ? home()
    : state.tab === "apps" ? appsPanel()
    : state.tab === "safe" ? safePanel()
    : morePanel();
  document.getElementById("app").innerHTML = `
    <header><div class="row"><div><p class="eyebrow">Apex Care</p><h1>Device Control</h1></div><div class="badge">${VERSION}</div></div></header>
    <main>${body}</main>
    <nav><div class="inner">${tabs.map(([id, label]) =>
      `<button class="${state.tab===id?"on":""}" onclick="window.AC.tab('${id}')"><span>${label}</span></button>`).join("")}</div></nav>
  `;
}

window.AC = {
  tab(t) {
    state.tab = t;
    if (t === "apps" && !state.scanOk && !state.scanning) scanApps();
    if (t === "safe" && !state.safe.ok && !state.safe.scanning) runSafeScan();
    render();
  },
  scan() { scanApps(); },
  safeScan() { runSafeScan(); },
  clean() { cleanRam(); },
  closeOne(pkg) {
    if (!hasNative || typeof ApexNative.closeBackgroundApp !== "function") return;
    if (isProtected(pkg)) return;
    try {
      const r = JSON.parse(ApexNative.closeBackgroundApp(pkg));
      pushHistory(r.ok ? "Closed background app" : "Close blocked", r.ok ? pkg : (r.reason || pkg));
      loadMemory();
      render();
    } catch (e) {}
  },
  setFilter(f) { state.filter = f; render(); },
  setFindingFilter(f) { state.findingFilter = f; render(); },
  setSchedule(s) {
    state.autoSchedule = s;
    try { localStorage.setItem("apex.autoSchedule", s); } catch (e) {}
    pushHistory("Schedule updated", s === "off" ? "Auto-optimize off" : s === "nightly" ? "Nightly 2:00 AM" : "Twice daily");
    render();
  },
  setQ(v) {
    state.q = v; render();
    const el = document.querySelector('input[type=search]');
    if (el) { el.focus(); const n = el.value.length; el.setSelectionRange(n, n); }
  },
  refreshAll() {
    loadMemory();
    if (state.scanOk) scanApps();
    if (state.safe.ok) runSafeScan();
    else render();
  },
};

try {
  loadMemory();
  scanApps();
  if (!document.getElementById("app").innerHTML) render();
} catch (err) {
  var el = document.getElementById("app");
  if (el) {
    el.innerHTML = "<div style=\"padding:24px;color:#eef1f4;font-family:system-ui\"><h1 style=\"color:#3ecfbf\">Apex Care</h1><p>UI failed to start.</p><pre style=\"white-space:pre-wrap;color:#e07a7a;font-size:12px\">" + String(err && err.stack || err) + "</pre></div>";
  }
}
</script>
</body>
</html>
