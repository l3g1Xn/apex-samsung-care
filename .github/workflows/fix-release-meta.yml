name: Fix Release Meta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Tag, describe, and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: '365194539'
        run: |
          set -euo pipefail
          BODY=$(cat <<'EOF'
          ## Apex Care v0.1.4 beta

          Installable Android APK for Apex Care — Device Care upgrade.

          ### Download
          - **ApexCare-v0.1.4-beta.apk** (~4.3 MB)
          - Package: `com.apexcare.app`
          - versionName **0.1.4-beta** · versionCode **14**
          - Min Android 8.0 (API 26) · Target API 34

          ### What's included
          - Live **Health** score (RAM-based, no fixed phone-model label)
          - Real on-device **PackageManager** app inventory (user / system / disabled)
          - **Safe** local heuristic scanner (install source, permissions, debuggable, target SDK)
          - Resizable transparent **RAM** home-screen widget (free RAM + Clean)
          - Store section removed from the app shell

          ### Install
          1. Download the APK on your phone
          2. Allow install from browser / unknown sources if prompted
          3. Open **Apex Care**

          ### Notes
          - Sideloaded / demo signing (not Play Store)
          - Heuristic findings are signals, not cloud malware verdicts
          - OEM process-kill APIs remain system-privileged on stock Android
          - Package stays under the ~56 MB (2× Device Care) budget
          EOF
          )

          # Publish the draft: assign real tag, body, and clear draft flag
          curl -sS -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/l3g1Xn/apex-samsung-care/releases/${RELEASE_ID}" \
            -d "$(jq -n \
              --arg tag "v0.1.4-beta" \
              --arg name "Apex Care v0.1.4 beta" \
              --arg body "$BODY" \
              --arg target "main" \
              '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:true, make_latest:"true", target_commitish:$target}')" \
            | jq '{id, tag_name, name, draft, prerelease, html_url}'
