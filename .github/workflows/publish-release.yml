name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC" dist/ApexCare-v0.1.7-beta.apk
          ls -lh dist/ApexCare-v0.1.7-beta.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.7-beta
          name: Apex Care v0.1.7 beta
          prerelease: true
          make_latest: true
          files: dist/ApexCare-v0.1.7-beta.apk
          body: |
            ## Apex Care v0.1.7 beta

            Package `com.apexcare.app` · versionCode **17** · versionName **0.1.7-beta**

            - Care health score + Optimize / Clean (non-vital background apps)
            - Protect rules for core OS / telephony / keyboard
            - Safe local malware / PUA heuristics
            - Apps inventory with pinned bottom nav
            - RAM widget: free/total RAM, disk free, process count, animated Clean

            Install: uninstall older Apex Care → install this APK → badge **v0.1.7 beta**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
