name: Publish Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          set -e
          mkdir -p dist
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          test -f "$SRC"
          cp "$SRC" dist/ApexCare-v1.0.0.apk
          ls -lh dist/ApexCare-v1.0.0.apk

      - name: Recreate v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true

      - name: Publish v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Apex Care v1.0.0 — Full Send Edition
          prerelease: false
          make_latest: true
          files: dist/ApexCare-v1.0.0.apk
          fail_on_unmatched_files: true
          body: |
            ## Apex Care v1.0.0 — Full Send Edition

            Package `com.apexcare.app` · versionCode **18** · versionName **1.0.0**

            ### What's in this build
            - Free-RAM % from multi-sample **MemAvailable** median
            - Optimize / Clean with root `am force-stop` when Magisk/su grants access
            - **Grant Temporary Root** in-app (no APK can auto-root on install)
            - Running Apps & Processes + Safe heuristics + auto-close
            - Resizable RAM widget (free % primary, ROOT badge, real Clean)
            - Scaled bottom nav · flame splash · badge **v1.0.0**

            ### Install
            1. Uninstall any older Apex Care
            2. Download **ApexCare-v1.0.0.apk** below
            3. Allow unknown sources → install → open
            4. Badge should read **v1.0.0**

            Root is optional. Physics is not a participation trophy.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
