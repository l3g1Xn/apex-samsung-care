name: Publish Release

# Only on explicit version tags — never re-wipe sole release.
# Avoids redundant Full Send re-publishes of the same premise.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Verify demo keystore present
        run: |
          test -f android/keystore/apex-release.jks
          ls -la android/keystore/

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version from tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # ApexCare-v1.0.1.apk from v1.0.1
          NAME="ApexCare-${TAG}.apk"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> $NAME"

      - name: Build signed universal release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage + verify signature
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          test -f "$SRC"
          APK="dist/${{ steps.ver.outputs.apk }}"
          cp "$SRC" "$APK"
          ls -lh "$APK"

          jarsigner -verify -verbose -certs "$APK" | tee /tmp/jsign.txt
          grep -qi "jar verified" /tmp/jsign.txt

          unzip -l "$APK" | grep -E 'META-INF/.*\.(RSA|SF|MF)' | tee /tmp/meta.txt
          test -s /tmp/meta.txt

          python3 - <<PY
          data=open("$APK","rb").read()
          assert data.rfind(b"APK Sig Block 42") != -1, "missing APK Signature Scheme v2/v3 block"
          print("APK Sig Block OK")
          PY

          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          fi
          echo "SIGNED UNIVERSAL APK READY"

      - name: Publish release (non-destructive)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Apex Care ${{ steps.ver.outputs.tag }}
          prerelease: false
          make_latest: true
          files: dist/${{ steps.ver.outputs.apk }}
          fail_on_unmatched_files: true
          body: |
            ## Apex Care ${{ steps.ver.outputs.tag }}

            Maintenance / security build for **Make RAM Great Again**.

            Package `com.apexcare.app` · signed universal (v1 + v2 + v3)

            ### Install
            1. Uninstall older Apex Care if prompted
            2. Install **${{ steps.ver.outputs.apk }}** only
            3. Open → check free% vs Samsung Device Care
            4. Optional: Grant Temporary Root (Magisk su in-process)

            ### Safety
            - Package-name allowlist before any `am force-stop`
            - Expanded One UI protect list
            - WebView offline + no file cross-origin
            - Demo signing for sideload — not Play Store

            **Not affiliated with Samsung, Google, or Magisk.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
