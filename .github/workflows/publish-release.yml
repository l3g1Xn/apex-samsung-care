name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC" dist/ApexCare-v1.0.0.apk
          ls -lh dist/ApexCare-v1.0.0.apk

      - name: Delete existing v1.0.0 release/tag if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Apex Care v1.0.0 — Full Send Edition
          prerelease: true
          make_latest: true
          files: dist/ApexCare-v1.0.0.apk
          body: |
            ## Apex Care v1.0.0 (pre-release) — Full Send Edition

            Package `com.apexcare.app` · versionCode **18** · versionName **1.0.0**

            ### What's new
            - **Properly scaled bottom nav** — in-app sized icons + labels (Care · Running · Safe · More)
            - **MAGA Hot Wheels splash** — flame logo overlay that disappears after open
            - **Grant Temporary Root** — app + widget path for deeper `am force-stop` / PID kill when Magisk/su is present
            - Honest about OS limits: **Android cannot auto-grant root on APK install**
            - Accurate free-RAM % bubble (MemAvailable multi-sample median)
            - Running Apps & Processes + Safe auto-close

            ### Install
            1. Uninstall older Apex Care
            2. Install this APK
            3. Open → splash fades → optional **Grant Temporary Root** if Magisk/su already installed
            4. Badge: **v1.0.0**

            Root optional. Accuracy not optional.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
