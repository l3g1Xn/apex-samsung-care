name: Publish Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Verify demo keystore present
        run: |
          test -f android/keystore/apex-release.jks
          ls -la android/keystore/

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed universal release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage + verify signature (must not be unsigned)
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          test -f "$SRC"
          cp "$SRC" dist/ApexCare-v1.0.0.apk
          ls -lh dist/ApexCare-v1.0.0.apk

          # v1 jar signature check
          jarsigner -verify -verbose -certs dist/ApexCare-v1.0.0.apk | tee /tmp/jsign.txt
          grep -qi "jar verified" /tmp/jsign.txt

          # Must have CERT.RSA / .SF
          unzip -l dist/ApexCare-v1.0.0.apk | grep -E 'META-INF/.*\.(RSA|SF|MF)' | tee /tmp/meta.txt
          test -s /tmp/meta.txt

          # APK Signature Scheme v2/v3 block present
          python3 - <<'PY'
          data=open("dist/ApexCare-v1.0.0.apk","rb").read()
          assert data.rfind(b"APK Sig Block 42") != -1, "missing APK Signature Scheme v2/v3 block"
          print("APK Sig Block OK")
          PY

          # Prefer apksigner if SDK provides it
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner 2>/dev/null | head -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose dist/ApexCare-v1.0.0.apk
          fi
          echo "SIGNED UNIVERSAL APK READY"

      - name: Recreate v1.0.0 release (wipe prior assets/tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Delete every release so only the new v1.0.0 remains
          for tag in $(gh release list --limit 50 --json tagName -q '.[].tagName' 2>/dev/null || true); do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          # Drop any leftover tags (previous versions)
          for ref in $(git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##' | sed 's#\^{}##'); do
            echo "Deleting tag $ref"
            git push origin ":refs/tags/$ref" 2>/dev/null || true
          done

      - name: Publish v1.0.0 (signed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Apex Care - Full Send Edition v1.0.0
          prerelease: false
          make_latest: true
          files: dist/ApexCare-v1.0.0.apk
          fail_on_unmatched_files: true
          body: |
            ## Apex Care - Full Send Edition v1.0.0

            Package `com.apexcare.app` · versionCode **18** · versionName **1.0.0**

            **Sole release** — replaces all prior APKs. Signed universal (v1 + v2 + v3).  
            Only asset: `ApexCare-v1.0.0.apk`

            ### Highlights
            - **RAM free/used fixed** (Device Care aligned): free = available, used = total − free
            - Magisk Grant Root + userspace TEMP ROOT when Superuser empty
            - Universal Samsung APK · widget free% corrected

            ### Install
            1. **Uninstall any older Apex Care** first
            2. Download **ApexCare-v1.0.0.apk** only
            3. Install → open → check free% vs Device Care
            4. Badge **v1.0.0**

            Demo signing for sideload — not Play Store.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
