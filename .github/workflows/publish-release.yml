name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC" dist/ApexCare-v0.1.7-beta.apk
          ls -lh dist/ApexCare-v0.1.7-beta.apk

      - name: Delete existing release if present
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.7-beta --yes --repo ${{ github.repository }} || true
          git push origin :refs/tags/v0.1.7-beta || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.7-beta
          name: Apex Care v0.1.7 beta
          prerelease: true
          make_latest: true
          files: dist/ApexCare-v0.1.7-beta.apk
          body: |
            ## Apex Care v0.1.7 beta

            ### APK
            - `ApexCare-v0.1.7-beta.apk`
            - Package: `com.apexcare.app`
            - versionName **0.1.7-beta** · versionCode **17**

            ### What's new
            - **Accurate RAM** — free % from multi-sample median `/proc/meminfo` MemAvailable (app + widget)
            - Primary UI: **free RAM percentage bubble**
            - **Force close** — root `am force-stop` when rooted; used by Optimize, Clean, and per-app Force close
            - **Running Apps & Processes** tab — live list with PSS; closed apps leave the list
            - **Safe auto-close** — after scan, force-closes open high/medium risk apps (toggle on Safe)
            - Bottom nav stays pinned (no overlay bug)

            ### Install
            1. Uninstall older Apex Care
            2. Install this APK
            3. Grant root if you want full FORCE_CLOSE (optional)
            4. Badge should read **v0.1.7 beta**

            ### Notes
            - Without root, background kill is used (Android restriction)
            - Core OS / phone / keyboard never force-closed
            - ~3.7 GB free on a 12 GB S25 Ultra is normal (MemAvailable after system reservation)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
