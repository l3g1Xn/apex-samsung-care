name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble release (signed, no publish)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --quiet

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          jarsigner -verify "$APK" > /tmp/jsign.txt
          grep -qi "jar verified" /tmp/jsign.txt
          python3 -c 'import sys; d=open(sys.argv[1],"rb").read(); assert d.rfind(b"APK Sig Block 42")!=-1' "$APK"

      - name: Guard - no shell injection helpers
        run: |
          set -euo pipefail
          grep -q "forceStopPackage" android/app/src/main/java/com/apexcare/app/MagiskRoot.java
          grep -q "isSafeRootCommand" android/app/src/main/java/com/apexcare/app/MagiskRoot.java
          grep -q "isValidPackage" android/app/src/main/java/com/apexcare/app/ProtectedPackages.java
          grep -q "sampleFast" android/app/src/main/java/com/apexcare/app/RamMetrics.java
          grep -q "WebViewAssetLoader" android/app/src/main/java/com/apexcare/app/MainActivity.java
          grep -q "loadDataWithBaseURL" android/app/src/main/java/com/apexcare/app/MainActivity.java
          grep -q "scanUsableRamKbFast" android/app/src/main/java/com/apexcare/app/RamMetrics.java
          grep -q "CLEAN_EXEC" android/app/src/main/java/com/apexcare/app/RamCleanerWidget.java
          grep -q "USER_PREFS" android/app/src/main/java/com/apexcare/app/ProtectedPackages.java
          grep -q "IMPORTANCE_VISIBLE" android/app/src/main/java/com/apexcare/app/DeviceBridge.java
          grep -q "addUserProtect" android/app/src/main/java/com/apexcare/app/DeviceBridge.java
          grep -q "ensureElevated" android/app/src/main/java/com/apexcare/app/DeviceBridge.java
          grep -q "reclaimPackage" android/app/src/main/java/com/apexcare/app/DeviceBridge.java
          grep -q "ensureElevated" android/app/src/main/java/com/apexcare/app/MagiskRoot.java
          ! grep -q "setAllowUniversalAccessFromFileURLs(true)" android/app/src/main/java/com/apexcare/app/MainActivity.java
          ! grep -q "ACTION_CLEAN_RAM" android/app/src/main/AndroidManifest.xml
          ! grep -R -F 'kill -9' android/app/src/main/java
          ! grep -R -F '/data/local/tmp/su' android/app/src/main/java
          ! grep -q "PACKAGE_USAGE_STATS" android/app/src/main/AndroidManifest.xml

      - name: Scrub Actions logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}/logs" || true
